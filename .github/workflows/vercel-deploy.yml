name: Deploy to Vercel

# Vercel's own Git integration cannot watch this repository: it is owned by
# diversive-technologies while the Vercel project lives in khizar-iqbal's
# personal account, and a host cannot natively subscribe to a repo it has no
# access to. The deploy therefore runs here, authenticated by a long-lived
# VERCEL_TOKEN held in this repository's Actions secrets.
#
# Consequence worth knowing before a 3 a.m. debugging session: that token is a
# CREDENTIAL WITH AN EXPIRY, not part of the code. When it lapses the run fails
# with "The token provided via --token argument is not valid", which reads like
# a build break and is not one. Rotating it is the repository owner's action.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  # Production deploys queue rather than cancel, so main never lands a build
  # that was killed halfway. Pull request previews are superseded freely.
  group: vercel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The repository's own gates, run before anything reaches Vercel. A deploy
  # that skipped these would be a downgrade from what the project already
  # enforces locally.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Single source of truth: .nvmrc, matching the Vercel project's Node
          # version so the gates run on what production actually runs.
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Production dependencies only: a high or critical advisory in what the
      # store ships fails the run before anything reaches Vercel. Development
      # tooling is left out on purpose; it never reaches a customer.
      - run: npm audit --omit=dev --audit-level=high
      # F-12: the build is a gate too. It validates the environment at boot
      # (SSOT-03), so it gets the minimum to parse: build-only values that reach
      # nothing — the build makes no call that needs a live backend.
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://ci.invalid
          JAVA_API_BASE_URL: http://127.0.0.1:9
          SESSION_SECRET: ci-build-only-session-secret-0123456789

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Resolve target (push to main = production, pull request = preview)
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.target }}" = "production" ]; then
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      #
      # The build runs ON VERCEL, not on this runner, and that is deliberate.
      #
      # The obvious alternative — `vercel pull` then `vercel build --prebuilt`,
      # which is what the sibling diversive-website workflow does — CANNOT work
      # for this project. `vercel pull` returns every environment value as an
      # empty string here, so the runner would build with no configuration at
      # all: `src/config/env.client.ts` validates NEXT_PUBLIC_APP_URL at module
      # load and throws, and the build dies collecting page data with
      # "Invalid client environment". Verified by running it.
      #
      # Deploying from source instead lets Vercel inject the real Production or
      # Preview values at build time, which is how the first successful deploy
      # of this project was made. It also removes an entire class of drift:
      # there is exactly one place environment values come from.
      #
      - name: Deploy to Vercel
        run: vercel deploy ${{ steps.cfg.outputs.flag }} --yes --token=${{ secrets.VERCEL_TOKEN }}
      #
      # F-12 — after a PRODUCTION deploy, prove the live store answers: health
      # reaches Java, the catalogue and a product page render, the security headers
      # are on. Read-only; places no order. A failure fails the run, which is how a
      # bad release is noticed. `--wait=90` keeps retrying the health check while the
      # new deployment takes over the production address.
      #
      # STORE_URL is a repository VARIABLE (https://<store domain>), set by the
      # operator at I-08. While it is unset the check is skipped with a warning
      # rather than failing a deploy that is otherwise fine.
      #
      - name: Smoke check production
        if: steps.cfg.outputs.flag == '--prod'
        env:
          STORE_URL: ${{ vars.STORE_URL }}
        run: |
          if [ -z "$STORE_URL" ]; then
            echo "::warning::Repository variable STORE_URL is not set; the post-deploy smoke check was skipped."
            exit 0
          fi
          node scripts/smoke.mjs "$STORE_URL" --wait=90
